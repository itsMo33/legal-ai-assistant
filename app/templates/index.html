<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المساعد القانوني السعودي</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap');

  :root {
    --bg: #0a0f1e;
    --surface: #111827;
    --surface2: #1a2236;
    --border: #1e3a5f;
    --accent: #1d6fa4;
    --accent2: #2563eb;
    --gold: #c9a84c;
    --text: #e8edf5;
    --text2: #8899b4;
    --danger: #dc2626;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tajawal', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.3s, color 0.3s;
  }

  /* ===== الهيدر ===== */
  header {
    background: linear-gradient(135deg, #0d1b2e 0%, #111827 100%);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    flex-shrink: 0;
  }

  .logo { display: flex; align-items: center; gap: 12px; }

  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 0 20px rgba(37,99,235,0.3);
  }

  .logo-text h1 { font-size: 16px; font-weight: 700; }
  .logo-text p  { font-size: 11px; color: var(--text2); margin-top: 1px; }

  .badge {
    background: rgba(29,111,164,0.15);
    border: 1px solid rgba(29,111,164,0.3);
    color: #60a5fa;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    display: flex; align-items: center; gap: 6px;
  }

  .badge::before {
    content: '';
    width: 7px; height: 7px;
    background: #22c55e;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100%{opacity:1} 50%{opacity:0.3}
  }

  .hbtns { display: flex; gap: 8px; }

  .hbtns button {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    cursor: pointer;
    font-size: 13px;
    font-family: 'Tajawal', Arial, sans-serif;
    transition: all 0.2s;
  }

  .hbtns button:hover { border-color: var(--accent2); color: var(--text); }
  #clear-btn { color: #f87171; border-color: rgba(220,38,38,0.3); }
  #clear-btn:hover { background: rgba(220,38,38,0.1); }

  /* ===== أسئلة سريعة ===== */
  #quick {
    padding: 8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    flex-shrink: 0;
  }
  #quick::-webkit-scrollbar { display: none; }
  #quick span { color: var(--gold); font-size: 12px; font-weight: 700; white-space: nowrap; align-self: center; }

  .qbtn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    cursor: pointer;
    font-size: 13px;
    font-family: 'Tajawal', Arial, sans-serif;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .qbtn:hover { border-color: var(--accent2); color: #93c5fd; background: rgba(37,99,235,0.1); transform: translateY(-1px); }

  /* ===== الشات ===== */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ===== ترحيب ===== */
  .welcome { text-align: center; margin: auto; padding: 30px 20px; }
  .welcome-icon {
    width: 75px; height: 75px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; margin: 0 auto 16px;
    box-shadow: 0 0 40px rgba(37,99,235,0.2);
  }
  .welcome h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .welcome p  { font-size: 14px; color: var(--text2); line-height: 1.8; max-width: 340px; margin: 0 auto; }
  .tips { display: flex; gap: 8px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .tip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--text2);
  }

  /* ===== الرسائل ===== */
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row.user { flex-direction: row; }  /* المستخدم على اليمين */
  .row.bot  { flex-direction: row-reverse; } /* البوت على اليسار */

  .av {
    width: 32px; height: 32px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  .av.bot  { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .av.user { background: linear-gradient(135deg, #065f46, #059669); }

  .mc { display: flex; flex-direction: column; gap: 3px; max-width: 72%; }
  .row.user .mc { align-items: flex-end; }
  .row.bot  .mc { align-items: flex-start; }

  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.8;
  }
  .bubble.user {
    background: linear-gradient(135deg, #1d6fa4, #2563eb);
    color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(37,99,235,0.25);
  }
  .bubble.bot {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }

  .mtime { font-size: 11px; color: var(--text2); padding: 0 4px; }

  /* ===== تحميل ===== */
  .dots {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    padding: 14px 20px;
    display: flex; gap: 6px; align-items: center;
  }
  .dot {
    width: 8px; height: 8px;
    background: var(--accent2);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2){animation-delay:0.2s}
  .dot:nth-child(3){animation-delay:0.4s}
  @keyframes bounce {
    0%,60%,100%{transform:translateY(0);opacity:0.4}
    30%{transform:translateY(-8px);opacity:1}
  }

  /* ===== الإدخال ===== */
  #inp {
    padding: 14px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: center;
    flex-shrink: 0;
  }

  #inp input {
    flex: 1;
    padding: 12px 18px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    font-family: 'Tajawal', Arial, sans-serif;
    outline: none; direction: rtl;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #inp input::placeholder { color: var(--text2); }
  #inp input:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

  #send-btn {
    width: 46px; height: 46px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white; border: none; border-radius: 12px;
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(37,99,235,0.3);
    flex-shrink: 0;
  }
  #send-btn:hover { transform: scale(1.06); box-shadow: 0 6px 20px rgba(37,99,235,0.4); }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* ===== الوضع النهاري ===== */
  body.light {
    --bg: #f0f4ff;
    --surface: #ffffff;
    --surface2: #e8eef8;
    --border: #c5d3ea;
    --text: #1e293b;
    --text2: #64748b;
    --gold: #b45309;
  }
  body.light header { background: linear-gradient(135deg, #1e3a8a, #1d4ed8); }
  body.light .logo-text h1 { color: white; }
  body.light .logo-text p  { color: rgba(255,255,255,0.7); }
  body.light .badge { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); color: white; }
  body.light .hbtns button { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); color: white; }
  body.light #clear-btn { color: #fca5a5; }
  body.light .bubble.bot { background: white; color: #1e293b; border-color: #dde5f0; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">&#x2696;&#xFE0F;</div>
    <div class="logo-text">
      <h1>المساعد القانوني السعودي</h1>
      <p>مدعوم بالذكاء الاصطناعي - نظام العمل السعودي</p>
    </div>
  </div>
  <div class="badge">متصل ونشط</div>
  <div class="hbtns">
    <button id="theme-btn">&#x2600;&#xFE0F; نهاري</button>
    <button id="clear-btn">&#x1F5D1;&#xFE0F; مسح</button>
  </div>
</header>

<div id="quick">
  <span>&#x26A1; سريع:</span>
  <button class="qbtn" id="q1">&#x1F3D6;&#xFE0F; الإجازة السنوية</button>
  <button class="qbtn" id="q2">&#x23F0; ساعات العمل</button>
  <button class="qbtn" id="q3">&#x2696;&#xFE0F; الفصل التعسفي</button>
  <button class="qbtn" id="q4">&#x1F4C4; إنهاء العقد</button>
  <button class="qbtn" id="q5">&#x1F4B0; نهاية الخدمة</button>
  <button class="qbtn" id="q6">&#x1F476; إجازة الأمومة</button>
</div>

<div id="chat">
  <div class="welcome">
    <div class="welcome-icon">&#x2696;&#xFE0F;</div>
    <h2>مرحباً بك في المساعد القانوني</h2>
    <p>اسألني أي سؤال عن نظام العمل السعودي وسأجيبك من المصدر الرسمي</p>
    <div class="tips">
      <div class="tip">&#x1F4CB; نظام العمل الرسمي</div>
      <div class="tip">&#x1F916; LLaMA 3.3</div>
      <div class="tip">&#x1F1F8;&#x1F1E6; متخصص بالسعودية</div>
    </div>
  </div>
</div>

<div id="inp">
  <button id="send-btn">&#x27A4;</button>
  <input type="text" id="question" placeholder="اكتب سؤالك عن نظام العمل السعودي...">
</div>

<script>
var isDark = true;

document.getElementById("q1").onclick = function(){ ask("كم يوم الإجازة السنوية؟"); };
document.getElementById("q2").onclick = function(){ ask("ما هي ساعات العمل القانونية؟"); };
document.getElementById("q3").onclick = function(){ ask("ما هي حقوق العامل عند الفصل التعسفي؟"); };
document.getElementById("q4").onclick = function(){ ask("كم مدة إشعار إنهاء العقد؟"); };
document.getElementById("q5").onclick = function(){ ask("ما هو راتب نهاية الخدمة؟"); };
document.getElementById("q6").onclick = function(){ ask("ما هي إجازة الأمومة؟"); };

document.getElementById("send-btn").onclick = function(){
  var q = document.getElementById("question").value.trim();
  if(q) ask(q);
};

document.getElementById("question").onkeypress = function(e){
  if(e.key === "Enter"){
    var q = this.value.trim();
    if(q) ask(q);
  }
};

document.getElementById("theme-btn").onclick = function(){
  isDark = !isDark;
  document.body.classList.toggle("light");
  this.textContent = isDark ? "نهاري ☀️" : "ليلي 🌙";
};

document.getElementById("clear-btn").onclick = function(){
  document.getElementById("chat").innerHTML = "<div class='welcome'><div class='welcome-icon'>&#x2696;&#xFE0F;</div><h2>مرحباً بك في المساعد القانوني</h2><p>اسألني أي سؤال عن نظام العمل السعودي وسأجيبك من المصدر الرسمي</p><div class='tips'><div class='tip'>&#x1F4CB; نظام العمل الرسمي</div><div class='tip'>&#x1F916; LLaMA 3.3</div><div class='tip'>&#x1F1F8;&#x1F1E6; متخصص بالسعودية</div></div></div>";
  fetch("/clear", {method:"POST"});
};

function getTime(){
  return new Date().toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"});
}

function ask(question){
  document.getElementById("question").value = "";
  var chat = document.getElementById("chat");
  var welcome = chat.querySelector(".welcome");
  if(welcome) welcome.remove();

  // رسالة المستخدم - على اليمين
  var urow = document.createElement("div");
  urow.className = "row user";
  urow.innerHTML = "<div class='mc'><div class='bubble user'>" + question + "</div><div class='mtime'>" + getTime() + "</div></div><div class='av user'>&#x1F464;</div>";
  chat.appendChild(urow);

  // تحميل - على اليسار
  var loadrow = document.createElement("div");
  loadrow.className = "row bot";
  loadrow.id = "loadrow";
  loadrow.innerHTML = "<div class='mc'><div class='dots'><div class='dot'></div><div class='dot'></div><div class='dot'></div></div></div><div class='av bot'>&#x2696;&#xFE0F;</div>";
  chat.appendChild(loadrow);

  chat.scrollTop = chat.scrollHeight;
  document.getElementById("send-btn").disabled = true;

  fetch("/ask",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({question:question})
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    document.getElementById("loadrow").remove();
    // رسالة البوت - على اليسار
    var brow = document.createElement("div");
    brow.className = "row bot";
    var ans = data.answer.split("\n").join("<br>");
    brow.innerHTML = "<div class='mc'><div class='bubble bot'>" + ans + "</div><div class='mtime'>" + getTime() + "</div></div><div class='av bot'>&#x2696;&#xFE0F;</div>";
    chat.appendChild(brow);
    chat.scrollTop = chat.scrollHeight;
    document.getElementById("send-btn").disabled = false;
  })
  .catch(function(){
    document.getElementById("loadrow").remove();
    var brow = document.createElement("div");
    brow.className = "row bot";
    brow.innerHTML = "<div class='mc'><div class='bubble bot'>حدث خطأ، حاول مرة أخرى.</div></div><div class='av bot'>&#x2696;&#xFE0F;</div>";
    chat.appendChild(brow);
    document.getElementById("send-btn").disabled = false;
  });
}
</script>
</body>
</html>
